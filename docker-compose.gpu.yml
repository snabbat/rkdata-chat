# Surcharge optionnelle : donne le GPU NVIDIA à l'Ollama en conteneur.
# Activation : voir COMPOSE_FILE dans .env.example, ou
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
